<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #term { position: absolute; inset: 4px 0 0 6px; }
  #suggest { position: absolute; display: none; z-index: 10; min-width: 220px; max-width: 70%; max-height: 180px; overflow: hidden;
             border-radius: 6px; font: 12px "Cascadia Mono", Consolas, monospace; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  #suggest div { padding: 3px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #suggest div small { opacity: .55; margin-left: 10px; }
  #suggest .hint { font-size: 11px; opacity: .6; padding: 2px 10px 4px; cursor: default; }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(128,128,128,.45); border-radius: 5px; }
</style>
</head>
<body>
<div id="term"></div>
<div id="suggest"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-search.js"></script>
<script src="addon-web-links.js"></script>
<script src="zmodem.js"></script>
<script>
  const host = window.chrome.webview;
  const post = m => host.postMessage(m);
  const term = new Terminal({ allowProposedApi: true, scrollback: 5000, fontSize: 14, cursorBlink: true, allowTransparency: true,
                              fontFamily: '"Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace' });
  const fit = new FitAddon.FitAddon();
  const search = new SearchAddon.SearchAddon();
  term.loadAddon(fit);
  term.loadAddon(search);
  term.loadAddon(new WebLinksAddon.WebLinksAddon((e, uri) => post({ t: 'link', url: uri })));
  term.open(document.getElementById('term'));

  let copyOnSelect = false, rightClickPaste = true, suggestOn = true;

  // ---- the line being typed, for suggestions and history. null once we lose track (arrows, tab completion, full-screen apps).
  let line = '';
  function track(data) {
    if (term.buffer.active.type === 'alternate') { line = null; return; }
    for (const ch of data) {
      if (ch === '\r') { if (line && line.trim()) post({ t: 'exec', s: line }); line = ''; continue; }
      if (line === null) continue;
      if (ch === '\x7f' || ch === '\b') line = line.slice(0, -1);
      else if (ch === '\x03' || ch === '\x15') line = '';
      else if (ch < ' ' || ch === '\x1b') line = null;
      else line += ch;
    }
    if (data.startsWith('\x1b')) line = null;
    if (suggestOn) post({ t: 'line', s: line ?? '' });
  }

  term.onData(d => { if (zsession) { if (d === '\x03') zabort(); return; } track(d); post({ t: 'input', d }); });
  term.onBinary(d => post({ t: 'binary', d: btoa(d) }));
  term.onResize(s => post({ t: 'resize', c: s.cols, r: s.rows }));
  term.onTitleChange(s => post({ t: 'title', s }));
  term.onSelectionChange(() => { if (copyOnSelect && term.hasSelection()) post({ t: 'copy', s: term.getSelection() }); });
  term.onBell(() => post({ t: 'bell' }));
  // OSC 7: file://host/path — shells that report the working directory let SFTP follow it.
  term.parser.registerOscHandler(7, data => {
    try { post({ t: 'cwd', p: decodeURIComponent(new URL(data).pathname) }); } catch { }
    return true;
  });

  // ---- suggestions popup
  const box = document.getElementById('suggest');
  let items = [], picked = 0;
  function renderSuggest() {
    if (!items.length || line === null || !line.length) { box.style.display = 'none'; return; }
    box.innerHTML = '';
    items.forEach((it, i) => {
      const d = document.createElement('div');
      d.textContent = it.text;
      if (it.kind) { const s = document.createElement('small'); s.textContent = it.kind; d.appendChild(s); }
      if (i === picked) d.className = 'sel';
      d.onmousedown = e => { e.preventDefault(); accept(i); };
      box.appendChild(d);
    });
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = '→ 或 Tab 采用 · Alt+↑↓ 选择 · Esc 关闭';
    box.appendChild(hint);
    const core = term._core, dims = core._renderService.dimensions.css.cell;
    const x = 6 + term.buffer.active.cursorX * dims.width, y = 4 + (term.buffer.active.cursorY + 1) * dims.height;
    box.style.left = Math.min(x, window.innerWidth - 240) + 'px';
    box.style.top = (y + 184 > window.innerHeight ? y - dims.height - 188 : y) + 'px';
    box.style.display = 'block';
    applySuggestColors();
  }
  function accept(i) {
    const rest = items[i].text.substring(line.length);
    items = []; renderSuggest();
    if (rest.length) { term.focus(); track(rest); post({ t: 'input', d: rest }); }
  }
  function applySuggestColors() {
    const th = term.options.theme || {};
    box.style.background = th.background && th.background !== 'transparent' ? th.background : '#1e1e1e';
    box.style.color = th.foreground || '#ddd';
    box.style.border = '1px solid ' + (th.selectionBackground || '#555');
    for (const d of box.querySelectorAll('.sel')) d.style.background = th.selectionBackground || '#264f78';
  }

  term.attachCustomKeyEventHandler(e => {
    if (e.type !== 'keydown') return true;
    const open = box.style.display === 'block';
    if (open && (e.key === 'Tab' || (e.key === 'ArrowRight' && !e.ctrlKey && !e.altKey))) { e.preventDefault(); accept(picked); return false; }
    if (open && e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { picked = (picked + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length; renderSuggest(); return false; }
    if (open && e.key === 'Escape') { items = []; renderSuggest(); return false; }
    if (e.ctrlKey && e.shiftKey) {
      const k = e.key.toLowerCase();
      if (k === 'c') { if (term.hasSelection()) post({ t: 'copy', s: term.getSelection() }); return false; }
      if (k === 'v') { post({ t: 'paste' }); return false; }
      if (k === 'f') { post({ t: 'hotkey', k: 'find' }); return false; }
    }
    if (e.ctrlKey && !e.shiftKey && e.key === 'c' && term.hasSelection()) { post({ t: 'copy', s: term.getSelection() }); term.clearSelection(); return false; }
    if (e.ctrlKey && !e.shiftKey && e.key === 'v') { post({ t: 'paste' }); return false; }
    if (e.ctrlKey && (e.key === '=' || e.key === '+' || e.key === '-' || e.key === '0')) { post({ t: 'hotkey', k: 'zoom' + (e.key === '-' ? '-' : e.key === '0' ? '0' : '+') }); return false; }
    return true;
  });

  document.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (rightClickPaste && !term.hasSelection()) post({ t: 'paste' });
    else post({ t: 'menu', s: term.getSelection() });
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => e.preventDefault());

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const tob64 = a => { let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray ? a.subarray(i, i + 0x8000) : a.slice(i, i + 0x8000)); return btoa(s); };

  // ---------- ZMODEM (rz / sz) ----------
  // The page watches the output for a ZMODEM start; files are read and written by the host app, a chunk per message.
  let zsession = null, zseq = 0, zpickDone = null;
  const zreads = new Map(), zsaves = new Map();
  const zask = (map, msg) => new Promise(res => { const id = ++zseq; map.set(id, res); post(Object.assign({ id }, msg)); });
  const size = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
  function zprogress(name, done, total, started, end) {
    const secs = Math.max((Date.now() - started) / 1000, 0.001);
    const pct = total ? Math.min(100, Math.floor(done * 100 / total)) : 100;
    const bar = '#'.repeat(Math.floor(pct / 5)).padEnd(20, '.');
    term.write('\r\x1b[K\x1b[36m' + name + '\x1b[0m [' + bar + '] ' + pct + '% ' + size(done) + ' / ' + size(total) + '  ' + size(done / secs) + '/s' + (end ? '\r\n' : ''));
  }
  function zfail(e) {
    term.write('\r\n\x1b[31mZMODEM 传输出错：' + (e && e.message || e) + '\x1b[0m\r\n');
    if (zsession) { try { zsession.abort(); } catch { } }
    zsession = null;
    post({ t: 'zdone' });
  }
  function zabort() {
    if (!zsession) return;
    try { zsession.abort(); } catch { }
    zsession = null;
    term.write('\r\n\x1b[33m已取消传输\x1b[0m\r\n');
    post({ t: 'zdone', aborted: true });
  }
  const sentry = new Zmodem.Sentry({
    to_terminal: octets => term.write(new Uint8Array(octets)),
    sender: octets => post({ t: 'zout', d: tob64(new Uint8Array(octets)) }),
    on_retract: () => { },
    on_detect: detection => {
      const session = detection.confirm();
      zsession = session;
      session.on('session_end', () => { if (zsession === session) { zsession = null; post({ t: 'zdone' }); } });
      if (session.type === 'receive') zreceive(session); else zsend(session);
    },
  });
  function zreceive(session) {
    term.write('\r\n');
    session.on('offer', async xfer => {
      const d = xfer.get_details();
      const ok = await zask(zsaves, { t: 'zsave', name: d.name, size: d.size || 0 });
      if (!ok) { xfer.skip(); term.write('\x1b[90m跳过 ' + d.name + '\x1b[0m\r\n'); return; }
      const id = zseq, started = Date.now();
      let done = 0, last = 0;
      xfer.on('input', payload => {
        done += payload.length;
        post({ t: 'zwrite', id, d: tob64(new Uint8Array(payload)) });
        if (Date.now() - last > 150) { last = Date.now(); zprogress(d.name, done, d.size || done, started); }
      });
      try { await xfer.accept(); zprogress(d.name, done, d.size || done, started, true); post({ t: 'zclose', id, ok: true }); }
      catch (e) { post({ t: 'zclose', id, ok: false }); throw e; }
    });
    session.start();
  }
  function zsend(session) {
    term.write('\r\n');
    zpickDone = async files => {
      try {
        if (!files.length) { session.abort(); zsession = null; term.write('\x1b[33m没有选择文件\x1b[0m\r\n'); post({ t: 'zdone', aborted: true }); return; }
        let remaining = files.reduce((a, f) => a + f.size, 0);
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          const xfer = await session.send_offer({ name: f.name, size: f.size, mtime: new Date(f.mtime), files_remaining: files.length - i, bytes_remaining: remaining });
          remaining -= f.size;
          if (!xfer) { term.write('\x1b[90m对方已有 ' + f.name + '，跳过\x1b[0m\r\n'); continue; }
          const started = Date.now();
          let off = 0, last = 0;
          while (true) {
            const chunk = await zask(zreads, { t: 'zread', file: f.i, off, n: 65536 });
            if (zsession !== session) return;
            off += chunk.length;
            if (off >= f.size || !chunk.length) { await xfer.end(chunk); break; }
            xfer.send(chunk);
            if (Date.now() - last > 150) { last = Date.now(); zprogress(f.name, off, f.size, started); }
          }
          zprogress(f.name, off, f.size, started, true);
        }
        await session.close();
      } catch (e) { zfail(e); }
    };
    post({ t: 'zpick' });
  }
  function zpicked(files) { const f = zpickDone; zpickDone = null; if (f) f(files); }
  host.addEventListener('message', ev => {
    const m = ev.data;
    switch (m.t) {
      case 'data': { const bytes = b64(m.d); try { sentry.consume(bytes); } catch (e) { zfail(e); term.write(bytes); } break; }
      case 'zfiles': zpicked(m.files || []); break;
      case 'zchunk': { const r = zreads.get(m.id); if (r) { zreads.delete(m.id); r(b64(m.d || '')); } break; }
      case 'zsaved': { const r = zsaves.get(m.id); if (r) { zsaves.delete(m.id); r(!!m.ok); } break; }
      case 'zabort': zabort(); break;
      case 'text': term.write(m.s); break;
      case 'opts':
        if (m.theme) term.options.theme = m.theme;
        if (m.fontFamily) term.options.fontFamily = m.fontFamily;
        if (m.fontSize) term.options.fontSize = m.fontSize;
        if (m.cursorStyle) term.options.cursorStyle = m.cursorStyle;
        if (m.cursorBlink !== undefined) term.options.cursorBlink = m.cursorBlink;
        if (m.scrollback) term.options.scrollback = m.scrollback;
        if (m.lineHeight) term.options.lineHeight = m.lineHeight;
        if (m.copyOnSelect !== undefined) copyOnSelect = m.copyOnSelect;
        if (m.rightClickPaste !== undefined) rightClickPaste = m.rightClickPaste;
        if (m.suggest !== undefined) suggestOn = m.suggest;
        document.body.style.background = m.background || 'transparent';
        doFit();
        break;
      case 'suggest': items = m.items || []; picked = 0; renderSuggest(); break;
      case 'find': {
        const o = { caseSensitive: !!m.caseSensitive, regex: !!m.regex, decorations: { matchOverviewRuler: '#888', activeMatchColorOverviewRuler: '#f90', matchBackground: '#665500', activeMatchBackground: '#aa6600' } };
        const ok = m.back ? search.findPrevious(m.q, o) : search.findNext(m.q, o);
        post({ t: 'found', ok });
        break;
      }
      case 'clearFind': search.clearDecorations(); break;
      case 'focus': term.focus(); break;
      case 'clear': term.clear(); break;
      case 'reset': term.reset(); line = ''; break;
      case 'selectAll': term.selectAll(); break;
      case 'getText': {
        const buf = term.buffer.active, out = [];
        const from = Math.max(0, buf.length - (m.lines || 200));
        for (let i = from; i < buf.length; i++) out.push(buf.getLine(i)?.translateToString(true) ?? '');
        post({ t: 'text', id: m.id, s: out.join('\n').replace(/\n+$/, '') });
        break;
      }
      case 'paste': term.paste(m.s); break;
      case 'fit': doFit(); break;
    }
  });

  function doFit() { try { fit.fit(); } catch { } }
  new ResizeObserver(doFit).observe(document.getElementById('term'));
  doFit();
  post({ t: 'ready', c: term.cols, r: term.rows });
</script>
</body>
</html>
